# Sirve la SPA: cualquier ruta desconocida cae en index.html (enrutado en cliente).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea los assets con hash en el nombre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
